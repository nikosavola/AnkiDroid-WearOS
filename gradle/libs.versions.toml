[versions]
agp = "9.2.1"
kotlin = "2.4.10"
compose-compiler = "2.4.0"
wear-compose = "1.6.2"
jna = "5.14.0"
coroutines = "1.9.0"
ktlint = "14.2.0"
ktfmt = "0.26.0"
detekt = "2.0.0-alpha.5"
# Testing
junit = "4.13.2"
robolectric = "4.14.1"
mockk = "1.13.13"
androidx-test-core = "1.6.1"
androidx-test-ext-junit = "1.2.1"
compose = "1.9.0"

[libraries]
# Kotlin and Coroutines
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# UniFFI / JNA support
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }

# Android Core and Lifecycle
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.17.0" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version = "2.9.3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.10.1" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version = "1.7.0" }
material = { group = "com.google.android.material", name = "material", version = "1.12.0" }

# Play Services Wearable
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version = "18.2.0" }

# WorkManager — periodic background deck sync on the phone
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version = "2.9.1" }

# Wear OS Compose
wear-compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wear-compose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wear-compose" }
wear-tiles = { group = "androidx.wear.tiles", name = "tiles", version = "1.5.0" }
wear-watchface-complications-data-source = { group = "androidx.wear.watchface", name = "watchface-complications-data-source-ktx", version = "1.3.0" }
# protolayout-material3 = the M3 Expressive tile components; it pins protolayout core to a strict
# [1.4.1], so pin the core explicitly to keep resolution unambiguous against tiles' own core dep.
wear-protolayout = { group = "androidx.wear.protolayout", name = "protolayout-material3", version = "1.4.1" }
wear-protolayout-core = { group = "androidx.wear.protolayout", name = "protolayout", version = "1.4.1" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
# Plain desktop JNA jar (the app uses the @aar with Android .so's; host JVM tests need the jar).
jna-jvm = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "compose" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "compose" }

# Phone (non-Wear) Compose — for the Material 3 Expressive UI migration (starting with the animated
# deck tree). material3 tracks its own version; foundation/ui/animation ride the `compose` version.
compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
compose-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "compose" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version = "1.4.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
