name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify Codebase (Format & Lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache Cargo Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check Rust Formatting
        run: cargo fmt --manifest-path core/Cargo.toml --all -- --check
      - name: Check Vendored Anki Sources
        # core/vendor/anki must stay byte-identical to upstream; offline sha256 check.
        run: scripts/vendor-rslib.sh --check
      - name: Run Codebase Verification (Lint & Format Checks)
        run: ./gradlew lintAll --no-daemon
  test:
    name: Test Suite (Rust & Kotlin) + Android Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      # The Gradle unit tests compile the app, which triggers generateBindings ->
      # compileRustAndroid* via cargo-ndk, so the Android Rust targets are needed alongside host.
      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Cache Cargo Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-
      - name: Install cargo-ndk
        # Cached via ~/.cargo/bin above; --locked keeps the install reproducible.
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
      - name: Run Rust Core Tests
        run: cargo test --manifest-path core/Cargo.toml
      - name: Run Kotlin Unit Tests (phone + wear)
        # Robolectric + host-JNA tests: the full FFI surface runs on the JVM (jna.library.path
        # points at the host-built libwearos_core.so via the compileRustHost task dependency).
        run: ./gradlew :phone:testDebugUnitTest :wear:testDebugUnitTest --no-daemon
      - name: Run Android Lint (phone + wear)
        run: ./gradlew :phone:lintDebug :wear:lintDebug --no-daemon
      - name: Build Release (unsigned, exercises R8/minify)
        # Neither module has a signingConfig on release, so this produces an unsigned APK - the
        # point is exercising R8 with the JNA/UniFFI keep rules, not producing a distributable build.
        run: ./gradlew :phone:assembleRelease :wear:assembleRelease --no-daemon
      - name: Check 16 KB Page-Size Alignment
        # Android 15+ (Wear OS 6) devices reject .so files with 4 KB-aligned LOAD segments.
        # The script resolves llvm-readelf from PATH, versioned names, or the NDK toolchain.
        run: scripts/check_16kb_alignment.sh
      - name: Upload Test/Lint Reports on Failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            phone/build/reports/tests/
            wear/build/reports/tests/
            phone/build/reports/lint-results-debug.html
            wear/build/reports/lint-results-debug.html
