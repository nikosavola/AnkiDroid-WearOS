# Custom Detekt configuration overriding overly pedantic rules for Android and Jetpack Compose.
build:
  maxIssues: 0
  excludeCorrectable: true
complexity:
  active: true
  LongMethod:
    active: true
    threshold: 120
  CyclomaticComplexMethod:
    active: true
    threshold: 25
  NestedBlockDepth:
    active: true
    threshold: 8
  LargeClass:
    active: false
  TooManyFunctions:
    active: false
naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
style:
  active: true
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  WildcardImport:
    active: false
exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
