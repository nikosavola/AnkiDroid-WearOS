[package]
name = "wearos-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "wearos_core"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.28.1", features = ["cli"] }
rusqlite = { version = "0.32.0", features = ["bundled"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
thiserror = "1.0.63"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow FFI and UniFFI-induced signature constraints
needless_pass_by_value = "allow"
# Allow missing public API documentation patterns in UniFFI wrappers
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Allow standard/natural cast-type conventions
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# Allow readable code structure over minor map-combinators
option_if_let_else = "allow"
# Allow other pedantic lints that are too strict for FFI bindings
must_use_candidate = "allow"
missing_const_for_fn = "allow"
too_long_first_doc_paragraph = "allow"
doc_markdown = "allow"
