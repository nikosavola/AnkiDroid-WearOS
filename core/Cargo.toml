[package]
name = "wearos-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "wearos_core"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.28.1", features = ["cli"] }
rusqlite = { version = "0.32.0", features = ["bundled"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
thiserror = "1.0.63"
