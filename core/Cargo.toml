[package]
name = "wearos-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "wearos_core"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.28.1", features = ["cli"] }
rusqlite = { version = "0.32.0", features = ["bundled"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
thiserror = "1.0.63"
# Pure-Rust gzip backend (miniz_oxide) so the crate's `unsafe_code = forbid` still holds; used to
# compress the due-batch payload inside the sync (de)serializers.
flate2 = "1.0"
# Protobuf encoding via derive macros only — no protoc / build.rs needed (messages are defined as
# annotated Rust structs). Experimental compact wire format for the due batch (see proto.rs).
prost = "0.13"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow FFI and UniFFI-induced signature constraints
needless_pass_by_value = "allow"
# Allow missing public API documentation patterns in UniFFI wrappers
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Allow standard/natural cast-type conventions at the FFI numeric boundary
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# Docs naturally name types/identifiers (AnkiDroid, HtmlCompat, NEXT_REVIEW_TIMES) in prose.
doc_markdown = "allow"
# #[must_use] is meaningless on the #[uniffi::export] surface (results always consumed by Kotlin).
must_use_candidate = "allow"
# const fn suggestions on FFI-exported methods are pointless (never called in a const context).
missing_const_for_fn = "allow"
