[package]
name = "wearos-core"
version = "0.1.0"
edition = "2024"
description = "Shared Rust core (session, buffer, sync protocol, card-HTML sanitizing, deck tree) for the AnkiDroid Wear OS companion, exported to Kotlin via UniFFI."
license = "Apache-2.0"
repository = "https://github.com/nikosavola/AnkiDroid-WearOS"
readme = "../README.md"
keywords = ["ankidroid", "wearos", "uniffi", "flashcards", "android"]
categories = ["api-bindings", "gui"]
publish = false

[lib]
name = "wearos_core"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32.1", features = ["cli"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
# zstd compression for the due-batch payload (best ratio/speed for this text-heavy data). The C
# backend is compiled per-target by cargo-ndk; `unsafe_code = forbid` only binds our crate, not deps.
zstd = "0.13"
# Protobuf encoding via derive macros only — no protoc / build.rs needed (messages are annotated
# Rust structs). The due-batch wire format (see proto.rs).
prost = "0.13"
# The same FSRS crate rslib uses, so preview intervals match AnkiDroid exactly; burn-free since 6.x.
fsrs = { version = "6.6.2", default-features = false }

# Release profile for the shipped Android .so. cargo-ndk builds --release, so this is what ships.
# LTO + a single codegen unit let the optimizer inline across crates and drop dead code (zstd,
# rusqlite, prost, uniffi are large), and strip removes symbols. NOT panic="abort": UniFFI wraps
# exported calls in catch_unwind to turn Rust panics into Kotlin exceptions, which abort would break.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Transitive dupes (hashbrown, syn) are inherent to the uniffi-bindgen vs rusqlite/prost trees
# and can't be unified from this crate; only our own dependency choices should fail the build.
multiple_crate_versions = "allow"
# Curated `restriction` guardrails (the group must never be enabled wholesale — it has
# contradictory lints). These catch debug/placeholder leftovers and enforce documented suppressions.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Allow FFI and UniFFI-induced signature constraints
needless_pass_by_value = "allow"
# Allow missing public API documentation patterns in UniFFI wrappers
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Allow standard/natural cast-type conventions at the FFI numeric boundary
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# Docs naturally name types/identifiers (AnkiDroid, HtmlCompat, NEXT_REVIEW_TIMES) in prose.
doc_markdown = "allow"
# #[must_use] is meaningless on the #[uniffi::export] surface (results always consumed by Kotlin).
must_use_candidate = "allow"
# const fn suggestions on FFI-exported methods are pointless (never called in a const context).
missing_const_for_fn = "allow"
